name: Post to Threads

on:
  # 朝 7:00 JST (22:00 UTC) / 昼 12:00 JST (03:00 UTC) / 夜 21:00 JST (12:00 UTC)
  # スクリプト内で ±30分のジッターを追加するため、固定時刻でOK
  schedule:
    - cron: '0 22 * * *'   # 朝枠
    - cron: '0 3 * * *'    # 昼枠
    - cron: '0 12 * * *'   # 夜枠
  workflow_dispatch:
    inputs:
      account:
        description: 'Account name (config/accounts/*.yaml)'
        required: false
        default: 'default'
      dry_run:
        description: 'Dry run (投稿しない)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # ジッター最大30分 + 処理時間

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_POSTS_DB_ID: ${{ secrets.NOTION_POSTS_DB_ID }}
          NOTION_CONFIG_DB_ID: ${{ secrets.NOTION_CONFIG_DB_ID }}
        run: |
          ACCOUNT="${{ github.event.inputs.account || 'default' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          if [ "$DRY_RUN" = "true" ]; then
            python -m src.pipeline --account "$ACCOUNT" --dry-run
          else
            python -m src.pipeline --account "$ACCOUNT"
          fi
