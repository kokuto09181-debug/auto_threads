name: Generate Weekly Topics

on:
  schedule:
    - cron: '0 14 * * 0'   # 毎週日曜 23:00 JST (14:00 UTC)
  workflow_dispatch:
    inputs:
      account:
        description: 'Account name'
        required: false
        default: 'default'

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate weekly topics
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_CONFIG_DB_ID: ${{ secrets.NOTION_CONFIG_DB_ID }}
          # metrics.yml と共有しないダミー値（topic_seeder は Posts DB を使わない）
          NOTION_POSTS_DB_ID: ${{ secrets.NOTION_POSTS_DB_ID }}
        run: |
          ACCOUNT="${{ github.event.inputs.account || 'default' }}"
          python -m src.topic_seeder --account "$ACCOUNT"
