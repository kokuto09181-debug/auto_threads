name: Collect Metrics & Update TOP5

on:
  schedule:
    - cron: '0 0 * * *'   # 毎日 09:00 JST (00:00 UTC)
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect metrics and update TOP5
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_POSTS_DB_ID: ${{ secrets.NOTION_POSTS_DB_ID }}
          NOTION_CONFIG_DB_ID: ${{ secrets.NOTION_CONFIG_DB_ID }}
        run: python -m src.metrics
